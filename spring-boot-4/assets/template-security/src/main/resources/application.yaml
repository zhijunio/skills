spring:
  application:
    name: template-security
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  security:
    oauth2:
      client:
        registration:
          company:
            provider: company
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          partner-inventory:
            provider: partner
            client-id: ${PARTNER_CLIENT_ID}
            client-secret: ${PARTNER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - inventory.read
        provider:
          company:
            authorization-uri: ${OIDC_AUTHORIZATION_URI}
            token-uri: ${OIDC_TOKEN_URI}
            user-info-uri: ${OIDC_USER_INFO_URI}
            user-name-attribute: ${OIDC_USERNAME_ATTRIBUTE:sub}
            jwk-set-uri: ${OIDC_JWK_SET_URI}
          partner:
            token-uri: ${PARTNER_TOKEN_URI}
      resourceserver:
        jwt:
          issuer-uri: ${RESOURCE_SERVER_ISSUER_URI}
          jwk-set-uri: ${RESOURCE_SERVER_JWK_SET_URI}
          audiences:
            - ${RESOURCE_SERVER_AUDIENCE}
demo:
  user:
    username: ${DEMO_USERNAME}
    password: ${DEMO_PASSWORD}
partners:
  inventory:
    base-url: ${PARTNER_API_BASE_URL}
app:
  mail:
    from: ${MAIL_FROM:no-reply@example.test}
management:
  endpoints:
    web:
      exposure:
        include: health,info
