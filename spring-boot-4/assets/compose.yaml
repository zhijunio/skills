services:
  postgres:
    image: __POSTGRESQL_IMAGE__
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # PG 18 data lives at /var/lib/postgresql. Mounting /var/lib/postgresql/data exits 1.
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
