version: "3"

dotenv:
  - .env

vars:
  MVNW: '{{if eq OS "windows"}}mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    cmds:
      - task: verify
  format:
    desc: Apply Spotless formatting
    cmds:
      - "{{.MVNW}} -q -B spotless:apply"
  verify:
    desc: Run Maven verification and coverage report
    cmds:
      - "{{.MVNW}} -q -B verify"
  run:
    desc: Run the application
    cmds:
      - "{{.MVNW}} -Pdev spring-boot:run"
  compose-up:
    desc: Start PostgreSQL, Redis, and Mailpit
    cmds:
      - docker compose up -d
  compose-down:
    desc: Stop local services
    cmds:
      - docker compose down
