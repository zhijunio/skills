spring:
  application:
    name: template-maven
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: true
  messages:
    basename: messages
    fallback-to-system-locale: false
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:${spring.application.name}}
    username: ${DATABASE_USERNAME:template}
    password: ${DATABASE_PASSWORD:template}
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        serialization-mode: via-dto
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
app:
  mail:
    from: ${MAIL_FROM:no-reply@example.test}
management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
