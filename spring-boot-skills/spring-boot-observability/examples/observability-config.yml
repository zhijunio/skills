# Illustrative OTLP push configuration; verify dependencies and properties for the actual Boot release.
# Internal collector URL assumes an approved isolated network; use TLS/auth for other deployments.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: 0.1
  # Requires the selected OTLP metrics registry. For Prometheus scraping use a separate
  # approved registry and expose its endpoint only to authorized scrapers.
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces

logging:
  structured:
    format:
      console: logstash
