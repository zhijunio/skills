# Runs the Spring Boot app with CRaC (Coordinated Restore at Checkpoint), built
# from Dockerfile-crac:
#
#   docker compose -f compose.crac.yaml up --build
#
# Set CRAC_MODE=create and CRAC_COMPATIBILITY_ID before creating a checkpoint.
# Review completeness and compatibility before setting CRAC_MODE=restore and
# CRAC_REVIEWED_ID to the reviewed identity. Use a separate volume for each
# artifact/runtime/configuration/platform; never delete evidence automatically.
#
# CRaC only works on a Linux host: CRIU snapshots and restores the live process,
# which is why the local example requests broad privileges. A clean checkpoint also requires that
# nothing holds an open network socket — an open JDBC/Redis connection at
# checkpoint time aborts CRaC. This file therefore runs the app with no database
# attached; take the checkpoint with an in-memory profile (or register CRaC
# resource handlers that close pooled connections). Review the elevated privileges
# against the host's security policy before using this local example.
services:
  spring-app-crac:
    build:
      context: .
      dockerfile: Dockerfile-crac
      # Front-end build mirrors for corporate proxies. Defaults match the
      # Dockerfile; override them in .env as needed.
      args:
        NODE_DOWNLOAD_ROOT: ${NODE_DOWNLOAD_ROOT:-https://nodejs.org/dist/}
        NPM_DOWNLOAD_ROOT: ${NPM_DOWNLOAD_ROOT:-https://registry.npmjs.org/npm/-/}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    # CRIU needs broad privileges to checkpoint and restore the JVM process. A
    # narrower set (cap_add: CHECKPOINT_RESTORE, SYS_PTRACE, SYS_ADMIN and
    # security_opt: seccomp:unconfined) works on most hosts; `privileged` is the
    # most portable choice for a local demo.
    privileged: false
    # Add only explicitly approved, runtime-required capabilities locally.
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      CRAC_MODE: ${CRAC_MODE:?Select create or restore}
      CRAC_COMPATIBILITY_ID: ${CRAC_COMPATIBILITY_ID:?Set reviewed compatibility identity}
      CRAC_REVIEWED_ID: ${CRAC_REVIEWED_ID:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - crac-checkpoint:/opt/crac/checkpoint
    restart: "no"

volumes:
  crac-checkpoint:
    name: ${CRAC_VOLUME_NAME:?Choose an isolated checkpoint volume}
