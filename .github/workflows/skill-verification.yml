name: Skill verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: ./mvnw clean install -B -ntp
      - name: Verify all skill resources in the JAR
        shell: bash
        run: |
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'skills-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            printf 'Expected one main JAR, found %s\n' "${#jars[@]}"
            exit 1
          fi
          python3 scripts/verify-skill-jar.py "${jars[0]}"
      - name: Verify SkillsJars extraction using a temporary consumer
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'skills-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          version="$(basename "${jars[0]}" .jar)"
          version="${version#skills-}"
          cat > "$scratch/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.verification</groupId>
            <artifactId>skills-consumer</artifactId>
            <version>1</version>
            <dependencies>
              <dependency>
                <groupId>io.github.zhijunio</groupId>
                <artifactId>skills</artifactId>
                <version>${skills.version}</version>
              </dependency>
            </dependencies>
          </project>
          POM
          ./mvnw -B -ntp -f "$scratch/pom.xml" \
            "-Dskills.version=$version" "-Ddir=$scratch/extracted" \
            -DuseSkillsNameAsDirectory=true com.skillsjars:maven-plugin:0.0.7:extract
          python3 scripts/verify-skill-installation.py "$scratch/extracted" --extracted

  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream reference implementation
        run: python -m pip install 'skills-ref @ git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref'
      - name: Prepare verification evidence
        run: |
          mkdir -p verification-evidence
          git rev-parse HEAD > verification-evidence/revision.txt
          python --version > verification-evidence/python-version.txt 2>&1
          python -m pip show skills-ref > verification-evidence/validator-version.txt
      - name: Validate skill metadata
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate-skill-metadata.py 2>&1 | tee verification-evidence/metadata.log
      - name: Test verification helpers and evaluation inputs
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee verification-evidence/helper-tests.log
      - name: Check generated skill catalog is current
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate-skill-catalog.py --check 2>&1 | tee verification-evidence/catalog.log
      - name: Inventory explicit skill references
        run: python scripts/analyze_skill_references.py > verification-evidence/skill-references.json
      - name: Measure static context size
        run: python scripts/measure_skill_context.py > verification-evidence/context-size.json
      - name: Upload deterministic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-verification-evidence
          path: verification-evidence/
          retention-days: 14
          if-no-files-found: warn

  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: List skills with the upstream CLI
        env:
          DISABLE_TELEMETRY: '1'
        run: npx --yes skills@1.9.1 add "$GITHUB_WORKSPACE" --list
      - name: Install into a temporary project for Codex and Claude Code
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cd "$scratch"
          git init -q
          npx --yes skills@1.9.1 add "$GITHUB_WORKSPACE" --skill '*' --agent codex claude-code --copy --yes
          python3 "$GITHUB_WORKSPACE/scripts/verify-skill-installation.py" "$scratch"

      - name: Verify explicit dependency group installation
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cd "$scratch"
          git init -q
          npx --yes skills@1.9.1 add "$GITHUB_WORKSPACE" --skill grill-with-docs --skill grilling --skill domain-modeling --agent codex claude-code --copy --yes
          python3 "$GITHUB_WORKSPACE/scripts/verify-skill-installation.py" "$scratch" --skill grill-with-docs --skill grilling --skill domain-modeling

  local-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify local Markdown links
        id: links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: "--offline --no-progress --verbose './*.md' 'docs/**/*.md' 'evals/**/*.md' 'engineering/**/*.md' 'spring-boot-skills/**/*.md' 'collected-skills/**/*.md'"
          fail: true
      - name: Record link check outcome
        if: always()
        env:
          LYCHEE_EXIT: ${{ steps.links.outputs.exit_code }}
        run: |
          echo "Lychee exit code: $LYCHEE_EXIT"
      - name: Upload link audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-link-audit
          path: lychee/out.md
          if-no-files-found: error

  spring-boot-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: verification/spring-boot-examples/pom.xml
      - name: Stage, compile and test selected skill examples
        shell: bash
        run: |
          set -o pipefail
          mkdir -p example-evidence
          git rev-parse HEAD > example-evidence/revision.txt
          java -version > example-evidence/java-version.txt 2>&1
          ./mvnw -version > example-evidence/maven-version.txt 2>&1
          python3 scripts/prepare_spring_boot_examples.py > example-evidence/sources.json
          ./mvnw -B -ntp -f verification/spring-boot-examples/pom.xml test 2>&1 | tee example-evidence/test.log
      - name: Upload example compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-example-compilation
          path: |
            example-evidence/
            verification/spring-boot-examples/target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn
