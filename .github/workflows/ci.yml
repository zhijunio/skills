name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: zhijun-io/github-workflows/.github/workflows/ci.yml@ac1365b64103fd6b6927e2cd04b09589e6879e50
    with:
      java-version: '17'
      upload-test-results: false
