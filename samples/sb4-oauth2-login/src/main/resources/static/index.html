<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统一登录示例</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="layout">
    <section class="intro">
      <span class="eyebrow">SPRING SECURITY · JWT</span>
      <h1>欢迎回来</h1>
      <p>使用本地账号或第三方身份提供方登录。登录后可以查看由本应用签发的 JWT 身份信息。</p>
      <div class="flow"><span>认证</span><b>→</b><span>签发应用 JWT</span><b>→</b><span>访问受保护接口</span></div>
    </section>
    <section class="card" id="login-card">
      <h2>账号登录</h2>
      <form id="login-form">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required value="demo">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">登录</button>
      </form>
      <p class="hint">演示账号：demo。密码通过环境变量 DEMO_PASSWORD 设置。</p>
      <div class="separator"><span>或使用第三方账号</span></div>
      <div class="providers" id="providers"></div>
      <p class="notice" id="message" role="status"></p>
    </section>
    <section class="card account hidden" id="account-card">
      <div class="account-head"><div><span class="eyebrow">已登录</span><h2>账户信息</h2></div><button class="secondary" id="logout">退出登录</button></div>
      <pre id="profile">正在读取…</pre>
      <p class="hint">访问令牌只保存在当前页面内存中，刷新页面后需要重新登录。</p>
    </section>
    <footer>示例应用 · 无刷新令牌 · 第三方登录仅交换为本地 JWT · <a href="/admin.html">提供方管理</a></footer>
  </main>
</body>
</html>
