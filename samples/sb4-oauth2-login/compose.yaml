services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oauth2_demo
      POSTGRES_USER: oauth2_demo
      POSTGRES_PASSWORD: oauth2_demo
    ports:
      - "5432:5432"
    volumes:
      - oauth2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth2_demo -d oauth2_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    restart: unless-stopped

volumes:
  oauth2-postgres-data:
