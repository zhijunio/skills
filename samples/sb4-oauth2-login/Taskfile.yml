version: '3'

vars:
  WRAPPER: '{{if eq OS "windows"}}mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  test:
    desc: Run the test suite
    cmds:
      - '{{.WRAPPER}} test'

  verify:
    desc: Run verification and package checks
    cmds:
      - '{{.WRAPPER}} verify'

  format:
    desc: Apply Java formatting
    cmds:
      - '{{.WRAPPER}} spotless:apply'

  run:
    desc: Run the application
    cmds:
      - '{{.WRAPPER}} spring-boot:run'
