issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /tmp/dex.db

web:
  http: 0.0.0.0:5556

enablePasswordDB: true

staticPasswords:
  - email: admin@example.com
    # Development-only bcrypt hash for the password "password".
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466

staticClients:
  - id: sample-web
    secret: sample-web-secret
    name: Spring Boot OAuth2 sample
    redirectURIs:
      - http://localhost:8080/login/oauth2/code/dex
