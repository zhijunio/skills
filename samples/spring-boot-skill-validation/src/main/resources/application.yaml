spring:
  application:
    name: spring-boot-skill-validation
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
app:
  tasks:
    max-page-size: ${TASKS_MAX_PAGE_SIZE:100}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
