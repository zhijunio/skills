spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sb4-jpa-vue-product
  docker:
    compose:
      lifecycle-management: start-and-stop
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SPRING_BOOT_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
