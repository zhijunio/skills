spring:
  application:
    name: sb4-memory-jwt
  config:
    import: optional:file:.env[.properties]
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:.local/keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:.local/keys/private.pem}
    key-id: ${JWT_KEY_ID:local-rsa-key}
    issuer: ${JWT_ISSUER:memory-jwt-api}
    audience: ${JWT_AUDIENCE:memory-jwt-client}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
