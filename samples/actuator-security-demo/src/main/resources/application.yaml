spring:
  application:
    name: actuator-security-demo
  config:
    import: optional:file:.env[.properties]
server:
  port: ${SERVER_PORT:8080}
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
app:
  security:
    business:
      username: ${BUSINESS_USERNAME:business}
      password: ${BUSINESS_PASSWORD}
    management:
      username: ${MANAGEMENT_USERNAME:operator}
      password: ${MANAGEMENT_PASSWORD}
