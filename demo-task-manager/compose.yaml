services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_app
      POSTGRES_PASSWORD: task_app_local
    ports:
      - "5432"
    volumes:
      - task_manager_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_app -d task_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  task_manager_data:
